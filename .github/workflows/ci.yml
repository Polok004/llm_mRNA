name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Does the package import with ONLY its core dependencies? ────────────────
  #
  # This is the job that would have caught the failure that broke every run so
  # far: `tenacity` (the [llm] extra) was imported at the top of
  # controller/llm_client.py, which controller/__init__.py imports, so
  # `import mrna_design.controller` raised ModuleNotFoundError for anyone who
  # had not installed that extra. The dev environment had it, so nothing local
  # ever failed.
  core-install:
    name: Core install (no extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install with no extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Every module must import
        run: |
          python - <<'PY'
          import importlib, pkgutil
          import mrna_design

          failed = []
          for mod in pkgutil.walk_packages(mrna_design.__path__, "mrna_design."):
              try:
                  importlib.import_module(mod.name)
              except Exception as exc:
                  failed.append(f"{mod.name}: {type(exc).__name__}: {exc}")
          if failed:
              raise SystemExit(
                  "These modules cannot be imported without optional extras:\n  "
                  + "\n  ".join(failed)
              )
          print("all modules import cleanly with core dependencies only")
          PY

      - name: CLI must run
        run: |
          mrna-design --help
          mrna-design optimize --help

      - name: A real optimisation must run
        run: |
          mrna-design optimize \
            --protein-name EGFP \
            --controller rule_based \
            --max-evals 5 \
            --pop 3 \
            --no-structure \
            --no-safety \
            --out "$RUNNER_TEMP/smoke"

  # ── Lint, type-check and test across supported Python versions ──────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Without this, the first version to fail cancels the others and their
      # results read as "Cancelled", which tells you nothing about whether the
      # failure is version-specific.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # No apt step: ViennaRNA ships manylinux wheels, and nothing in the test
      # suite shells out to BLAST+ or RNAhybrid (they are checked for presence
      # and skipped). Installing them cost about a minute per job for nothing.
      - name: Install package and extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,surrogate,llm,ui]"

      - name: Lint
        run: ruff check mrna_design tests ui

      - name: Format check
        run: ruff format --check mrna_design tests ui

      - name: Type check
        run: mypy mrna_design

      - name: Test
        run: pytest tests/ -v --tb=short --cov=mrna_design --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
        continue-on-error: true
