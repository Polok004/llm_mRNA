name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps (ViennaRNA build deps + BLAST+)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ncbi-blast+ pkg-config libgsl-dev

      - name: Install Python package
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,surrogate]"

      - name: Lint
        run: ruff check mrna_design tests

      - name: Type check
        run: mypy mrna_design || true   # non-blocking until types are complete

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=mrna_design --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
        continue-on-error: true
